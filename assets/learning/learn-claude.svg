  <rect x="108" y="118" width="88" height="22" rx="11" fill="#b8652e"/>
  <text x="152" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="600" fill="#fff">Start the course</text>
  <rect x="204" y="118" width="88" height="22" rx="11" fill="none" stroke="#b8652e" stroke-width="1.2"/>
  <text x="248" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="600" fill="#b8652e">Slash commands</text>

  <!-- module cards -->
  <text x="20" y="162" font-family="Arial, sans-serif" font-size="8" font-weight="600" fill="#6b5d50">Course modules</text>
  <rect x="20" y="168" width="112" height="48" rx="6" fill="#fff" stroke="#e8ddd2"/>
  <text x="30" y="184" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#b8652e">01</text>
  <text x="48" y="184" font-family="Arial, sans-serif" font-size="8" font-weight="600" fill="#1a1612">Introduction</text>
  <rect x="30" y="190" width="90" height="3" rx="1.5" fill="#e8ddd2"/>
  <rect x="30" y="197" width="72" height="3" rx="1.5" fill="#e8ddd2"/>

  <rect x="144" y="168" width="112" height="48" rx="6" fill="#fff" stroke="#e8ddd2"/>
  <text x="154" y="184" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#b8652e">02</text>
  <text x="172" y="184" font-family="Arial, sans-serif" font-size="8" font-weight="600" fill="#1a1612">What is Claude?</text>
  <rect x="154" y="190" width="90" height="3" rx="1.5" fill="#e8ddd2"/>
  <rect x="154" y="197" width="80" height="3" rx="1.5" fill="#e8ddd2"/>

  <rect x="268" y="168" width="112" height="48" rx="6" fill="#fff" stroke="#e8ddd2"/>
