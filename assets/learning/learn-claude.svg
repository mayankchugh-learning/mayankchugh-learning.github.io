<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-label="Learn Claude complete guide">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf8f5"/>
      <stop offset="100%" stop-color="#f4efe8"/>
    </linearGradient>
  </defs>

  <rect width="400" height="225" fill="url(#pageBg)"/>

  <!-- top nav strip -->
  <rect x="0" y="0" width="400" height="36" fill="#faf8f5"/>
  <line x1="0" y1="36" x2="400" y2="36" stroke="#e8e0d6" stroke-width="1"/>
  <text x="20" y="23" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#1a1612">LearnClaude</text>
  <rect x="318" y="12" width="62" height="14" rx="7" fill="#b8652e"/>
  <text x="349" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="600" fill="#fff">Book a call</text>

  <!-- hero -->
  <text x="200" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#9a8572" letter-spacing="1.5">COMPLETE LEARNING PATH · 2026</text>
  <text x="200" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#1a1612">
    <tspan>Master </tspan><tspan font-style="italic" fill="#b8652e">Claude</tspan>
  </text>
  <rect x="72" y="94" width="256" height="5" rx="2.5" fill="#ddd4ca" opacity="0.7"/>
  <rect x="100" y="103" width="200" height="4" rx="2" fill="#ddd4ca" opacity="0.5"/>

