  <text x="296" y="184" font-family="Arial, sans-serif" font-size="8" font-weight="600" fill="#1a1612">Claude Surfaces</text>
  <rect x="278" y="190" width="90" height="3" rx="1.5" fill="#e8ddd2"/>
  <rect x="278" y="197" width="76" height="3" rx="1.5" fill="#e8ddd2"/>
