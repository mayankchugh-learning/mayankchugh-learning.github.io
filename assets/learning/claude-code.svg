<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-label="Claude Code Tutorial">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0b1e"/>
      <stop offset="50%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d0b1e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="18%" r="55%">
      <stop offset="0%" stop-color="rgba(124,109,250,0.35)"/>
      <stop offset="100%" stop-color="rgba(124,109,250,0)"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c6dfa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="225" fill="url(#heroBg)"/>
  <ellipse cx="200" cy="28" rx="170" ry="70" fill="url(#glow)"/>

  <!-- badge -->
  <rect x="108" y="22" width="184" height="22" rx="11" fill="rgba(124,109,250,0.14)" stroke="rgba(124,109,250,0.38)" stroke-width="1"/>
  <rect x="122" y="31" width="72" height="4" rx="2" fill="#a78bfa" opacity="0.9"/>
  <rect x="200" y="31" width="78" height="4" rx="2" fill="#6b6580" opacity="0.55"/>

  <!-- title -->
  <text x="200" y="88" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="url(#titleGrad)">Claude Code</text>
  <text x="200" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="url(#titleGrad)" opacity="0.92">Master Class</text>

  <!-- subtitle bars -->
  <rect x="72" y="132" width="256" height="5" rx="2.5" fill="rgba(160,155,184,0.35)"/>
  <rect x="104" y="142" width="192" height="4" rx="2" fill="rgba(107,101,128,0.45)"/>

  <!-- stats -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="130" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#7c6dfa">10+</text>
    <text x="130" y="194" text-anchor="middle" font-size="9" fill="#6b6580">Concepts</text>
    <text x="270" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#7c6dfa">MCP</text>
    <text x="270" y="194" text-anchor="middle" font-size="9" fill="#6b6580">Skills</text>
  </g>

  <!-- mini terminal (right accent) -->
  <rect x="24" y="156" width="56" height="52" rx="8" fill="#12121a" stroke="rgba(124,109,250,0.35)" stroke-width="1"/>
  <circle cx="36" cy="168" r="3" fill="#f87171"/>
  <circle cx="46" cy="168" r="3" fill="#fbbf24"/>
  <circle cx="56" cy="168" r="3" fill="#34d399"/>
  <rect x="32" y="178" width="28" height="3" rx="1.5" fill="#38bdf8"/>
  <rect x="32" y="186" width="36" height="3" rx="1.5" fill="#a78bfa"/>
  <rect x="32" y="194" width="22" height="3" rx="1.5" fill="#34d399"/>

  <!-- mini terminal (left accent) -->
  <rect x="320" y="156" width="56" height="52" rx="8" fill="#12121a" stroke="rgba(56,189,248,0.28)" stroke-width="1"/>
  <rect x="328" y="172" width="40" height="3" rx="1.5" fill="#7c6dfa"/>
  <rect x="328" y="180" width="32" height="3" rx="1.5" fill="#38bdf8"/>
  <rect x="328" y="188" width="36" height="3" rx="1.5" fill="#fbbf24"/>
  <rect x="328" y="196" width="24" height="3" rx="1.5" fill="#34d399"/>

  <!-- bottom accent line -->
  <rect x="0" y="223" width="400" height="2" fill="url(#accentBar)" opacity="0.85"/>
</svg>
