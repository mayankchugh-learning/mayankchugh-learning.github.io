function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

function pb(label, text, technique, color){
  const tmap = {rctfc:['RCTFC','bi'],few:['Few-Shot','bt'],cot:['Chain of Thought','ba'],chain:['Prompt Chaining','bp'],meta:['Meta Prompting','br']};

function copyPrompt(btn){
  const txt = btn.closest('.prompt-wrap').querySelector('.ptext').textContent.trim();

}

/* ──── S0: Why Prompting Matters ──── */
'0-0': `
<div class="stat-hero"><div class="sn">82%</div><div class="sl2">of professionals use AI with vague, unstructured prompts</div><div class="ss">McKinsey AI Adoption Survey 2025 · Of those, 74% report "inconsistent or disappointing" output quality</div></div>

<div class="g2">
<div class="card ci"><div class="ch"><span style="font-size:20px">🎯</span><div><div class="ctit">No Role Given</div><div class="csub">AI defaults to "generic assistant"</div></div></div><div class="cbody">You get a surface-level answer written for no one in particular. Add a role and the depth, vocabulary, and perspective change entirely.</div></div>
<div class="card ca"><div class="ch"><span style="font-size:20px">🌫️</span><div><div class="ctit">Missing Context</div><div class="csub">AI operates in a vacuum</div></div></div><div class="cbody">Without knowing your situation, AI fills gaps with assumptions — often wrong ones. The more context, the more accurate the output.</div></div>

<div class="hero"><h2>Five techniques. Any model. Work that actually ships.</h2><p>These five methods cover everything from a single email to a multi-step analysis. Learn all five, then pick the one that matches the job — not the other way around.</p></div>
<div class="flow">
<div class="fstep"><div class="fnum">1</div><div class="fbody"><div class="ftit">RCTFC Framework <span class="badge bi" style="margin-left:4px">Foundation</span></div><div class="fdesc">Role, Context, Task, Format, Constraints. The 5-part structure that makes any prompt work. Use this as the default for any request you would be embarrassed to send unreviewed. Once it is a reflex, the other techniques slot in around it.</div></div></div>
<div class="fstep"><div class="fnum">2</div><div class="fbody"><div class="ftit">Shot Prompting <span class="badge bt" style="margin-left:4px">Examples</span></div><div class="fdesc">Instead of writing rules, show examples. Zero-shot is guessing. One-shot shows the pattern. Few-shot locks in your vocabulary, format, and classification logic. Three labelled examples usually beat a paragraph of rules.</div></div></div>
<div class="fstep"><div class="fnum">3</div><div class="fbody"><div class="ftit">Chain of Thought <span class="badge ba" style="margin-left:4px">Reasoning</span></div><div class="fdesc">Add "think step by step" to any prompt and watch AI slow down and reason. Accuracy improves on anything with tradeoffs — decisions, root-cause work, risk, or diagnosis — because you can see (and correct) the reasoning.</div></div></div>

/* ──── S1: RCTFC Framework ──── */
'1-0': `
<div class="hero"><h2>The 5-Part RCTFC Framework</h2><p>Each part removes a class of guesswork. Drop one and the draft usually degrades in a predictable way. Use all five when the output will be seen by someone else.</p></div>
<div class="flow">
<div class="fstep"><div class="lbadge" style="background:#1d6fa4;color:#fff;margin-top:1px">R</div><div class="fbody"><div class="ftit">Role — Who is the AI being?</div><div class="fdesc">Sets the expert lens for the entire response. Activates domain vocabulary and professional assumptions. Without a role: generic, shallow, written for no one in particular.</div>
<div class="irow" style="margin-top:8px"><span class="ikey">Example</span><span>Act as a senior account manager with 10 years of B2B experience.</span></div>
<div class="irow"><span class="ikey">Without it</span><span>AI responds as a neutral assistant. No depth, no expertise, no specificity.</span></div>
</div></div>
<div class="fstep"><div class="lbadge" style="background:#0D9488;color:#fff;margin-top:1px">C</div><div class="fbody"><div class="ftit">Context — What is the situation?</div><div class="fdesc">Gives background, stakes, and environment. Tells AI what actually matters here. Without context: AI operates in a vacuum and fills gaps with generic assumptions.</div>
<div class="irow" style="margin-top:8px"><span class="ikey">Example</span><span>We had a supplier meeting on Monday. The delivery is 3 weeks late. The VP of Operations, who was absent, has authority to escalate.</span></div>
<div class="irow"><span class="ikey">Without it</span><span>AI invents plausible context. Often wrong for your specific situation.</span></div>
</div></div>
<div class="fstep"><div class="lbadge" style="background:#7C3AED;color:#fff;margin-top:1px">T</div><div class="fbody"><div class="ftit">Task — What exactly do you need?</div><div class="fdesc">One unambiguous deliverable. Eliminates guessing. Without a clear task: AI decides what to give you — which may not be what you needed.</div>
<div class="irow" style="margin-top:8px"><span class="ikey">Example</span><span>Write a professional follow-up email to the supplier's procurement team.</span></div>
<div class="irow"><span class="ikey">Without it</span><span>AI gives you something adjacent — a summary, a list, a plan — when you needed an email.</span></div>
</div></div>
<div class="fstep"><div class="lbadge" style="background:#B45309;color:#fff;margin-top:1px">F</div><div class="fbody"><div class="ftit">Format — How should it look?</div><div class="fdesc">Specifies structure before AI writes anything. Without format: you get a wall of prose you still have to reformat. Specify it and you get something you can use immediately.</div>
<div class="irow" style="margin-top:8px"><span class="ikey">Example</span><span>Subject line + 3 short paragraphs + professional sign-off. Total under 200 words.</span></div>
<div class="irow"><span class="ikey">Without it</span><span>AI defaults to what it thinks looks like a good email — which may be 600 words long.</span></div>
</div></div>
<div class="fstep"><div class="lbadge" style="background:#BE185D;color:#fff;margin-top:1px">C</div><div class="fbody"><div class="ftit">Constraints — What are the non-negotiables?</div><div class="fdesc">Word limits, tone requirements, what to exclude, what not to start with. "Short" is vague. "Under 120 words" is a constraint. This is the most overlooked part of the framework.</div>
<div class="irow" style="margin-top:8px"><span class="ikey">Example</span><span>Acknowledge the delay without over-apologising. Do not make promises about compensation. Maintain a confident, partnership-first tone.</span></div>
<div class="irow"><span class="ikey">Without it</span><span>You get the right idea expressed the wrong way — wrong tone, wrong length, wrong emphasis.</span></div>
</div></div>
</div>`,

/* ──── S2: Shot Prompting ──── */
'2-0': `
<div class="hero"><h2>Show examples. Do not write a rulebook.</h2><p>Instructions are interpreted. Examples are copied. Three labelled examples usually beat a paragraph of rules — especially for classification, tone, and format.</p></div>
<div class="slabel">The progression</div>
<div class="g3">
<div class="card ci"><div class="ch"><span style="font-size:22px">0️⃣</span><div><div class="ctit">Zero-Shot</div><div class="csub">No examples given</div></div></div><div class="cbody">AI uses its own interpretation of what a good output looks like. Results are inconsistent. Vocabulary doesn't match yours. Format is AI's choice, not yours.</div><ul class="cl"><li>AI guesses your standard</li><li>Inconsistent across runs</li><li>Vocabulary mismatches</li><li>Fine for simple, low-stakes tasks</li></ul></div>
<div class="card ca"><div class="ch"><span style="font-size:22px">1️⃣</span><div><div class="ctit">One-Shot</div><div class="csub">One example given</div></div></div><div class="cbody">AI follows your template structure. Labels begin to align. Much more consistent than zero-shot — but edge cases can still slip through.</div><ul class="cl"><li>AI gets your format</li><li>Structure aligns</li><li>Partial vocabulary match</li><li>Good for standard, predictable tasks</li></ul></div>
<div class="card cg"><div class="ch"><span style="font-size:22px">3️⃣</span><div><div class="ctit">Few-Shot</div><div class="csub">3+ examples given</div></div></div><div class="cbody">AI learns your classification logic, vocabulary, and edge case handling. Output usually matches your standard closely enough that you review, not rewrite.</div><ul class="cl"><li>AI follows your standard precisely</li><li>Handles edge cases reliably</li><li>Vocabulary locked in</li><li>Best for classification, formatting, tone</li></ul></div>
</div>
<div class="notebox"><span>🎓</span><span><strong>The intern analogy:</strong> On day one you can hand someone a three-page manual (zero-shot), or show three examples of how the work is actually done. The examples win. You already have them — past emails, tickets, and reports.</span></div>`,

/* ──── S3: Chain of Thought ──── */
'3-0': `
<div class="hero"><h2>Ask it to reason, then answer.</h2><p>Models default to the most common-looking answer. Chain of Thought slows that down: you get reasoning you can check, not confidence you have to trust.</p></div>
<div class="slabel">Two ways AI can respond to the same question</div>
<div class="compare">
<div class="card cr"><div class="ch"><span class="badge br">Without CoT</span></div><div class="cbody">AI jumps to conclusion. Pattern-matches to the most common answer type. Sounds confident. No reasoning visible. If the answer is wrong, you can't see where it went wrong — or even that it went wrong.</div><ul class="cl"><li>Fast — but potentially wrong</li><li>Confidence ≠ accuracy</li><li>No visible reasoning to check</li><li>Misses nuanced situational factors</li></ul></div>
<div class="card cg"><div class="ch"><span class="badge bg">With CoT</span></div><div class="cbody">AI reasons step by step. Each step is visible and checkable. You can see where it made an assumption, catch an error before the conclusion, or redirect mid-reasoning. Significantly more accurate on complex tasks.</div><ul class="cl"><li>Slower — reliably better</li><li>Reasoning visible and verifiable</li><li>Catches hidden assumptions</li><li>Best on decisions, diagnoses, analysis</li></ul></div>
</div>
<div class="slabel">When to use Chain of Thought</div>
<div class="g3">
<div class="card ci"><div class="ctit" style="font-size:12px">✅ Use CoT</div><ul class="cl"><li>Decisions with real tradeoffs</li><li>Root cause analysis</li><li>Risk or impact assessment</li><li>Anything nuanced or multi-factor</li></ul></div>
<div class="card ca"><div class="ctit" style="font-size:12px">⚠️ CoT optional</div><ul class="cl"><li>Moderate complexity tasks</li><li>Writing with a specific constraint</li><li>Summarisation of complex material</li><li>Generating structured recommendations</li></ul></div>
<div class="card cs"><div class="ctit" style="font-size:12px">❌ Skip CoT</div><ul class="cl"><li>Simple factual lookups</li><li>Format conversions</li><li>Routine email drafts</li><li>Summarising short, clear material</li></ul></div>
</div>
<div class="notebox"><span>🩺</span><span><strong>The doctor analogy:</strong> A three-second diagnosis is pattern-matching. Thinking out loud — symptoms, alternatives, exceptions — is slower and more reliable. The extra twenty seconds are worth it. So is asking the model to show its reasoning.</span></div>`,

'3-1': `
<div class="slabel">The 3 phrases that unlock step-by-step reasoning</div>
<div class="g3">
<div class="trigger-card"><div class="tphrase">"Think step by step."</div><div class="tnote">Add this to any prompt. AI breaks down its reasoning process before concluding. Most versatile trigger — works on 90% of analytical tasks.</div></div>
<div class="trigger-card"><div class="tphrase">"Show your reasoning."</div><div class="tnote">Slightly different emphasis — asks AI to make its logic explicit, not just sequential. Useful when you want to audit the quality of thinking, not just the conclusion.</div></div>
<div class="trigger-card"><div class="tphrase">"Walk me through this."</div><div class="tnote">Most conversational of the three. Works well in dialogue-style prompts where you're exploring a problem together rather than requesting a finished output.</div></div>
</div>
<div class="slabel">How to add them to an existing prompt</div>
<div class="card" style="margin-bottom:11px"><div class="cbody" style="font-size:11.5px;line-height:1.7">
<strong>Original prompt:</strong> "Should we prioritise the partnership deal or the product launch this quarter?"<br><br>
<strong>CoT version:</strong> "Should we prioritise the partnership deal or the product launch this quarter? <span style="color:#1d6fa4;font-weight:700">Think step by step.</span> Consider financial impact, resource availability, strategic alignment, and stakeholder expectations. Reason through each factor before giving your recommendation."
</div></div>
<div class="slabel">Advanced: Quiet CoT (reasoning without the show)</div>
<div class="card cs"><div class="cbody">Sometimes you want the accuracy benefit of CoT but a clean, brief final output. Use this structure:<br><br>
<em style="color:#1d6fa4">"Think step by step internally. Then give me only your final recommendation — no reasoning shown. Answer in 2–3 sentences."</em><br><br>
AI reasons thoroughly but delivers a clean, concise output. Best for quick decisions where you trust the depth but don't need to audit every step.
</div></div>`,

'3-2': `
<div class="slabel">Same scenario — with and without CoT</div>
<div class="card ca" style="margin-bottom:4px"><div class="ch"><span class="badge ba">Scenario</span></div><div class="cbody">"I have two job offers. Company A is a fast-growing startup — higher salary, equity, more risk, longer hours. Company B is a large established firm — lower salary, stability, clear progression, better work-life balance. Which should I take?"</div></div>
<div class="compare" style="margin-top:10px">
<div>
<div class="slabel">Without CoT</div>
<div class="card cr"><div class="cbody" style="font-style:italic;color:#7F1D1D">"Based on your description, Company A seems like the better choice given the higher salary and growth potential. The equity could be significant if the company succeeds. However, if stability is important to you, Company B is also a solid option."</div>
<div class="cbody" style="margin-top:8px;color:#94A3B8;font-size:10.5px">Verdict: Generic. Presents both options without actually helping you decide. Could apply to anyone. Tells you nothing you didn't already know.</div></div>
</div>
<div>
<div class="slabel">With "Think step by step"</div>
<div class="card cg"><div class="cbody" style="font-size:11px;line-height:1.65;color:#065F46">
<strong>Step 1 — What is the actual decision context?</strong><br>This is a career inflection point, not just a salary comparison. The core question is: what do you optimise for at this stage of your career?<br><br>
<strong>Step 2 — Financial analysis:</strong><br>Higher base salary at A has immediate value. Equity is uncertain — startup success rates are 10–15%. At Company B, the lower salary is the cost of the optionality and stability you get back.<br><br>
<strong>Step 3 — Risk profile:</strong><br>At a startup, if it fails in 18 months, you restart your search in a tougher market. At the established firm, the downside is limited.<br><br>
<strong>Step 4 — Life stage factor:</strong><br>Do you have dependents, a mortgage, or commitments that make income predictability important right now?<br><br>
<strong>Recommendation:</strong> If you're in the first 5 years of your career with low personal financial obligations — Company A. If you have significant responsibilities or this is not the right risk moment — Company B. The equity only matters if the startup is post-Series B or has clear product-market fit.
</div></div>
</div>
</div>
<div class="notebox"><span>💡</span><span><strong>The shortcut to a confident wrong answer costs more than the 20 seconds it takes to ask for the reasoning.</strong></span></div>`,

'3-3': `
<div class="slabel">Chain of Thought prompts — ready to use</div>
${pb('Strategic decision analysis',`Role: Act as a senior management consultant.

Context: We are deciding between [OPTION A] and [OPTION B] for [SITUATION/BUSINESS CONTEXT]. The decision needs to be made by [DATE]. Key stakeholders: [LIST].

Task: Analyse both options and recommend one. Think step by step. Consider: financial impact, operational feasibility, stakeholder reaction, timeline, and risk exposure. Reason through each factor before concluding.

Format: For each option — 3 pros, 3 cons, 1-line verdict. Then a final recommendation paragraph with one specific next action.

Constraints: No vague statements. Quantify wherever possible. Flag your assumptions clearly. Under 400 words total.`,'cot','a')}

${pb('Root cause analysis',`Role: Act as an operations analyst specialising in process failure diagnosis.

Context: [DESCRIBE THE PROBLEM — what happened, when it started, what was affected, what has already been tried]. 

Task: Identify the root cause of this problem. Think step by step — first list all observable symptoms, then group them by pattern, then hypothesise 3 possible root causes, then assess which is most likely and why.

Format: Symptoms list → Root Cause Hypotheses (3) → Most Likely Root Cause + Evidence → Recommended First Fix.

Constraints: Distinguish clearly between symptoms and causes. Flag where data is insufficient. Avoid jumping to conclusions before completing the reasoning.`,'cot','a')}

${pb('Risk assessment for a business decision',`Role: Act as a risk management specialist.

Context: We are planning to [ACTION/INITIATIVE] in [TIMEFRAME]. Key dependencies: [LIST]. Stakeholders involved: [LIST].

Task: Assess the risk landscape for this decision. Think step by step — first identify all possible risk categories (financial, operational, reputational, regulatory, people), then rate each risk for likelihood and impact, then recommend mitigation actions for the top 3.

Format: Risk register table (Risk | Category | Likelihood | Impact | Mitigation) + Top 3 Priority Risks with detailed mitigation plan.

Constraints: Be specific. No generic risks like "market uncertainty". Each mitigation must have a named owner. Under 300 words for the narrative section.`,'cot','a')}`,

/* ──── S4: Prompt Chaining ──── */
'4-0': `
<div class="hero"><h2>Split the work. Review between steps.</h2><p>A mega-prompt is like asking for the whole route at once and hoping you remember every turn. Chaining splits the job: extract, then analyse, then produce — with a human check between steps.</p></div>
<div class="slabel">Why one mega-prompt fails</div>
<div class="compare">
<div class="card cr"><div class="ch"><span class="badge br">One Mega-Prompt</span></div><ul class="cl"><li>AI pattern-matches to "what a report looks like"</li><li>Skips real analysis — goes straight to conclusions</li><li>Errors compound — wrong extraction leads to wrong analysis</li><li>Output is generic even when data is specific</li><li>You can't course-correct mid-response</li></ul></div>
<div class="card cg"><div class="ch"><span class="badge bg">Chained Prompts</span></div><ul class="cl"><li>Each prompt has one clear job — no overload</li><li>You review and correct between steps</li><li>Analysis is built on real extracted facts</li><li>Final output is specific because inputs were specific</li><li>You stay in control of the entire process</li></ul></div>
</div>
<div class="slabel">The three-step pattern — works for almost any complex task</div>
<div class="flow">
<div class="fstep"><div class="fnum" style="background:#0D9488">1</div><div class="fbody"><div class="ftit" style="color:#0D9488">Extract</div><div class="fdesc">Ask only: what are the facts? No interpretation. No analysis. Just the raw signals from the data, document, or situation. This is the foundation — get it right first.</div></div></div>
<div class="fstep"><div class="fnum" style="background:#B45309">2</div><div class="fbody"><div class="ftit" style="color:#B45309">Analyse</div><div class="fdesc">Using the facts from Step 1: what do they mean? Why did these patterns happen? What connections exist? This is where you add Chain of Thought. AI now has real material to reason about.</div></div></div>
<div class="fstep"><div class="fnum" style="background:#5b4fc7">3</div><div class="fbody"><div class="ftit" style="color:#5b4fc7">Produce</div><div class="fdesc">Using both the facts and the analysis: write the final deliverable. Specify format, audience, word count. The output is now built on a real foundation — not pattern-matched assumptions.</div></div></div>
</div>
<div class="notebox"><span>🍽️</span><span><strong>The chef analogy:</strong> A tasting menu does not arrive as one plate. Each course sets up the next. Complex analysis works the same way — each prompt earns the right to the next one.</span></div>`,

'4-1': `
<div class="slabel">The 3-step pipeline in action — weekly performance report</div>
${pb('Prompt 1 — Extract (run this first)',`Below is this week's performance data: [PASTE YOUR DATA]

Your only job: extract the factual signals.
— What changed week over week (in absolute and percentage terms)?
— What is performing above target, below target, or at target?
— Are there any anomalies, outliers, or unexpected patterns?

List only facts. No interpretation. No analysis. Format as a numbered list. If the data is insufficient to determine something, say so.`,'chain','p')}

${pb('Prompt 2 — Analyse (paste Prompt 1 output above this)',`Using the factual signals identified above, now analyse the patterns.

For each major signal: what most likely caused it? Think step by step. Consider at least 2 alternative explanations for each significant change. Flag where you are making assumptions due to limited data.

Do not write a report. Do not produce a final output yet. Only reason through the causes and connections.`,'chain','p')}

${pb('Prompt 3 — Produce (paste Prompts 1 + 2 outputs above this)',`Using the data extracted and the analysis above, write a weekly performance summary for [AUDIENCE — e.g. the sales leadership team / the executive committee].

Format: Executive Summary (2 sentences) + Key Findings (3 bullets with specific numbers) + Root Cause Insights (2 bullets) + Action Points (3 bullets with named owners and due dates).

Constraints: Under 280 words. Confident and specific — no vague language. No findings that aren't supported by the data. Use exact numbers from the extraction.`,'chain','p')}

<div class="notebox"><span>🔗</span><span><strong>Important:</strong> Run each prompt in the same conversation thread. That way AI retains context automatically. Never start a new chat between chained prompts — you'll lose the accumulated context.</span></div>`,

'4-2': `
<div class="slabel">The most common prompt chaining mistakes</div>
<div class="flow">
<div class="fstep"><div class="fnum" style="background:#BE185D">!</div><div class="fbody"><div class="ftit">Skipping the Extract step</div><div class="fdesc">Going straight to "Analyse this data" without extracting first. AI skips past the facts and pattern-matches to what an analysis "should look like". Output sounds good but isn't grounded in your specific data.</div></div></div>
<div class="fstep"><div class="fnum" style="background:#BE185D">!</div><div class="fbody"><div class="ftit">Starting a new chat between steps</div><div class="fdesc">Each new chat wipes the context. If you start fresh for Prompt 2, AI doesn't have the Prompt 1 output. Stay in the same conversation — that's the chain.</div></div></div>
<div class="fstep"><div class="fnum" style="background:#BE185D">!</div><div class="fbody"><div class="ftit">Asking too many things in one step</div><div class="fdesc">"Extract the facts AND analyse the patterns AND write the summary" is still a mega-prompt disguised as chaining. Each step must have one job — no exceptions.</div></div></div>
<div class="fstep"><div class="fnum" style="background:#BE185D">!</div><div class="fbody"><div class="ftit">Not reviewing between steps</div><div class="fdesc">The power of chaining is that you can course-correct between prompts. If the extraction missed something, add it before running Step 2. Review between every step — don't just forward the output blindly.</div></div></div>
<div class="fstep"><div class="fnum" style="background:#BE185D">!</div><div class="fbody"><div class="ftit">Using chaining when you don't need it</div><div class="fdesc">Prompt chaining is for genuinely complex, multi-step tasks. A professional email or a simple summary doesn't need three prompts. Use RCTFC and be done in one. Reserve chaining for work that actually warrants it.</div></div></div>
</div>`,

'4-3': `
<div class="slabel">Prompt chains — ready to run</div>
${pb('Chain: Competitive analysis (Step 1 of 2 — Extract)',`Below is information about our competitor: [PASTE CONTENT — website copy, press releases, job listings, product announcements, pricing page, etc.]

Extract only observable facts:
— What products or services do they offer?
— What pricing model do they appear to use?
— What market segments are they targeting?
— What claims do they make about their differentiation?
— Any notable recent moves (launches, partnerships, hires)?

List only what is explicitly stated or clearly implied. Do not interpret, evaluate, or compare yet.`,'chain','p')}

${pb('Chain: Competitive analysis (Step 2 of 2 — Produce)',`Using the competitive facts extracted above, produce a competitive intelligence brief for our [PRODUCT/SERVICE AREA] team.

Format:
— Competitor Overview (3 sentences)
— Their Apparent Strategy (2 bullets)
— Where They Are Stronger Than Us (2 bullets — be honest)
— Where We Have the Advantage (2 bullets)
— Recommended Response (1 action for our team in the next 30 days)

Constraints: Evidence-based only — reference specific facts from the extraction. Under 300 words. No generic observations. Include one specific implication for how we should adjust our messaging or approach.`,'chain','p')}

${pb('Chain: Document analysis (Step 1 — Extract key points)',`Here is a [DOCUMENT TYPE — contract, report, research paper, policy, proposal]: [PASTE DOCUMENT]

Extract the following without interpretation:
— Main purpose or objective of this document
— Key commitments, obligations, or requirements mentioned
— Dates and deadlines referenced
— Any conditions, exceptions, or caveats
— Terms or definitions that need attention

Number each finding. Flag anything ambiguous with [UNCLEAR].`,'chain','p')}`,

/* ──── S5: Meta Prompting ──── */
'5-0': `
<div class="hero"><h2>When you do not know how to ask, ask the model how to ask.</h2><p>Meta prompting is for unfamiliar territory. You give the goal in plain language; the model returns a structured prompt. You edit the placeholders and run it — usually better than a first draft written from a blank box.</p></div>
<div class="slabel">What meta prompting gives you</div>
<div class="g3">
<div class="card ci"><div class="ctit" style="font-size:12px">🎯 A better starting structure</div><div class="cbody">AI knows what a well-structured prompt for this task type looks like. It will include parts you didn't think of — the role, the constraints, the format — automatically.</div></div>
<div class="card ca"><div class="ctit" style="font-size:12px">📚 Domain vocabulary</div><div class="cbody">When you're in an unfamiliar domain, you don't know the right terms to use. The AI-written prompt uses the language that gets better results in that specific context.</div></div>
<div class="card cg"><div class="ctit" style="font-size:12px">📈 A learning tool</div><div class="cbody">Read what AI wrote. The structure it chose becomes yours. After 5 rounds of meta prompting, you'll write those prompts yourself — without asking for help.</div></div>
</div>
<div class="slabel">The meta ask formula</div>
<div class="card ci" style="margin-bottom:11px"><div class="cbody" style="font-size:12px;line-height:1.7">
<strong style="color:#0f1e36">"I need to [brief description of your goal].</strong> I don't know the best way to structure a prompt for this. <strong>Write me the best possible prompt for this task</strong> — include role, context, task, format, and constraints. Use [PLACEHOLDER] brackets for the parts I'll fill in. Make it copy-paste ready."
</div></div>
<div class="notebox"><span>🏠</span><span><strong>The analogy:</strong> Before buying a first home, you ask someone who already did it: “What should I ask the solicitor?” Meta prompting is that call. You do not need the right questions yet — you need to admit you do not have them.</span></div>`,

'5-1': `
<div class="slabel">The 4-step loop — how meta prompting works in practice</div>
<div class="flow">
<div class="fstep"><div class="fnum" style="background:#BE185D">1</div><div class="fbody"><div class="ftit">You have a task — but you're stuck on the ask</div><div class="fdesc">New task type, unfamiliar domain, or you've tried prompting it and the output isn't right. This is the starting condition for meta prompting.</div></div></div>
<div class="fstep"><div class="fnum" style="background:#5b4fc7">2</div><div class="fbody"><div class="ftit">Ask AI to write the prompt</div><div class="fdesc">Use the meta ask formula. Give AI your goal in plain language. Ask for a structured prompt with [PLACEHOLDER] fields. Specify that you want RCTFC covered.</div></div></div>
<div class="fstep"><div class="fnum" style="background:#B45309">3</div><div class="fbody"><div class="ftit">Read, edit, personalise</div><div class="fdesc">Read the AI-generated prompt carefully. Fill in the [PLACEHOLDER] fields with your specific context. Remove what doesn't apply. Add nuance AI couldn't know about your situation.</div></div></div>
<div class="fstep"><div class="fnum" style="background:#059669">4</div><div class="fbody"><div class="ftit">Run the prompt → better output → learn</div><div class="fdesc">The output quality will be noticeably higher. Read what made the prompt structure good — that structure is now yours. Next time, you write it from scratch.</div></div></div>
</div>
<div class="slabel">Before and after: meta prompting in action</div>
<div class="compare">
<div class="card cr"><div class="ch"><span class="badge br">What you'd write</span></div><div class="cbody" style="font-style:italic;color:#9F1239">"Help me prepare for a difficult performance conversation with an underperforming team member."</div><div class="cbody" style="margin-top:6px">Vague. AI gives general advice. Not tailored to your situation, your role, or the specific conversation you're facing.</div></div>
<div class="card cg"><div class="ch"><span class="badge bg">What AI writes (when you ask it to)</span></div><div class="cbody" style="font-size:11px;line-height:1.65;color:#065F46"><em>"Role: Act as an experienced HR business partner coaching a line manager before a difficult performance conversation.<br>Context: [EMPLOYEE ROLE], [DURATION OF ISSUE], [PREVIOUS CONVERSATIONS HAD Y/N], [MANAGER'S CONCERN ABOUT HOW IT WILL GO].<br>Task: Help me prepare for this conversation — what to say, how to open, how to handle defensiveness, and how to close with clarity.<br>Format: Preparation guide with 5 sections: Opening, Key Messages, Anticipated Reactions + Responses, What to Avoid, How to Close.<br>Constraints: Practical and specific. No HR jargon. Under 350 words."</em></div></div>
</div>`,

'5-2': `
<div class="slabel">Meta prompts — ready to use</div>
${pb('The universal meta ask',`I need to [DESCRIBE YOUR GOAL IN 1-2 SENTENCES — be specific about what the final output is].

I'm not sure of the best way to structure a prompt for this task. Please write me the best possible prompt for this goal.

The prompt should include:
— A specific role for the AI to take
— All context I'll need to fill in (use [PLACEHOLDER] brackets)
— A clear task statement
— The ideal output format
— Key constraints (length, tone, what to avoid)

Make it copy-paste ready so I can personalise the [BRACKETS] and run it immediately.`,'meta','r')}

${pb('Meta prompt for a new document type',`I need to write a [DOCUMENT TYPE — e.g. board briefing, investment memo, capability statement, technical specification, stakeholder update] and I haven't written one before.

Please write me an expert-quality prompt that will help me produce this document. The prompt should:
— Define the role (what kind of expert should AI be?)
— List all the context fields I'll need to fill in with [PLACEHOLDERS]
— Specify the correct structure for this document type
— Include appropriate tone and length constraints for this audience

Also add a brief note (2 sentences) explaining what makes a strong [DOCUMENT TYPE] so I understand the standard I'm aiming for.`,'meta','r')}

${pb('Meta prompt for a recurring task',`I need to [DESCRIBE RECURRING TASK — e.g. write weekly team updates, prepare monthly client reports, draft supplier communication after issues].

I need a reusable prompt template for this task — one I can use every week/month by filling in the current details.

Please write a prompt template that:
— Sets the right role and context structure
— Has [PLACEHOLDER] fields for everything that changes each time (dates, names, specific situations)
— Has fixed fields for everything that stays the same (tone, format, audience, constraints)
— Is clearly organised so it's fast to fill in each time

Goal: I want to be able to use this prompt in under 3 minutes each time.`,'meta','r')}

${pb('Meta prompt for a difficult conversation',`I need to [DESCRIBE DIFFICULT COMMUNICATION SITUATION — e.g. deliver disappointing news, push back on a request from a senior stakeholder, address performance issues, decline a request professionally].

Please write me the best prompt that will help me prepare for and/or draft this communication.

The prompt should be designed to produce practical, specific output — not generic advice. Include all [PLACEHOLDERS] I'll need to fill in about the specific person, context, and stakes.`,'meta','r')}`,

/* ──── S6: Industry Prompt Library ──── */
'6-0': `
<div class="slabel">Business &amp; Strategy — complete prompts, ready to run</div>
${pb('Executive Decision Brief',`Role: Act as a strategic advisor who specialises in preparing executive-level decision documents.

Context: I need to present a recommendation on [DECISION — describe clearly] to [STAKEHOLDER — role and seniority]. The meeting is on [DATE]. They value concise, evidence-based arguments. They dislike jargon and generic frameworks.

Task: Write a one-page decision brief that outlines context, options, my recommendation, and the top risk if we get this wrong.

Format: Four sections — Background (2 sentences) + Options Considered (2–3 options, each with one pro and one con) + Recommendation (1 paragraph) + Key Risk (1 sentence). Under 280 words.

Constraints: No jargon. Recommendation must include one specific next action with a named owner. Be direct — no hedge language like "it could be argued that".`,'rctfc','')}

${pb('Meeting Action Capture',`Role: Act as an executive assistant skilled at extracting decisions and actions from unstructured meeting notes.

Context: Below are rough notes from a [MEETING TYPE — e.g. leadership sync, cross-functional review, client call] on [DATE] with attendees: [LIST NAMES AND ROLES].

Task: Extract all decisions made, actions assigned, and open questions that still need resolution.

Format: Three sections — Decisions Made (bulleted) + Action Items (table: Action | Owner | Due Date | Priority) + Open Questions (numbered list). Flag anything ambiguous with [UNCLEAR].

Constraints: Extract only what is explicitly stated. Do not infer or add context. Language should be direct and scannable — not narrative.

[PASTE MEETING NOTES BELOW]`,'rctfc','')}

${pb('Stakeholder Communication — Difficult News',`Role: Act as a communications specialist writing professional leadership messages.

Context: [SITUATION/EVENT] occurred on [DATE]. The stakeholder group is [AUDIENCE — who they are and how they'll likely react]. They have [HIGH/MEDIUM/LOW] awareness of the background.

Task: Write a professional communication from [SENDER ROLE] to this stakeholder group addressing this situation.

Format: Subject line + Opening (acknowledge situation, 1 sentence) + Context (what happened and why, 2 sentences) + What's being done (2 sentences) + Next steps (2 sentences) + Close. Under 200 words.

Constraints: Confident but not dismissive. No corporate clichés. Direct and human tone. Do not minimise the issue — address it head-on.`,'rctfc','')}

${pb('Strategic Options Analysis — with Chain of Thought',`Role: Act as a management consultant specialising in strategic decision-making.

Context: We are deciding between [OPTION A — describe] and [OPTION B — describe] for [SITUATION]. Decision needs to be made by [DATE]. Relevant constraints: [LIST CONSTRAINTS — budget, timeline, resources, approvals needed].

Task: Analyse both options and recommend one. Think step by step. Consider: financial impact, operational feasibility, stakeholder reaction, timeline, and risk exposure. Reason through each factor before concluding.

Format: For each option — 3 pros, 3 cons, 1-line verdict. Then a final Recommendation paragraph (2–3 sentences) with one specific next action.

Constraints: Quantify wherever possible. Flag assumptions explicitly. No vague statements. Under 400 words.`,'cot','a')}`,

'6-1': `
<div class="slabel">Marketing — complete prompts, ready to run</div>
${pb('Campaign Copy Generator',`Role: Act as a senior B2B copywriter with experience in [INDUSTRY] marketing.

Context: We are promoting [PRODUCT/SERVICE] to [TARGET AUDIENCE — job title, company size, industry]. The key value proposition is [SPECIFIC BENEFIT — not "saves time" but "reduces approval cycles from 5 days to same-day"]. Our brand tone is [PROFESSIONAL/CONVERSATIONAL/BOLD].

Task: Write three headline variations and one 60-word body copy for a [CHANNEL — email, LinkedIn ad, landing page banner].

Format: Three numbered headlines (max 10 words each) + one body copy block (60 words, ends with implied CTA).

Constraints: No hyperbole. No buzzwords like "revolutionary", "game-changing", or "seamless". Each headline must include a specific outcome, not just a feature. Body copy must address one specific pain point.`,'rctfc','')}

${pb('Content Repurposing — Few-Shot',`Repurpose the following source content for different formats. Here are three example conversions:

Long article → LinkedIn post: Extract the single most counterintuitive insight. Open with a bold claim or provocative question. Keep under 180 words. End with a question that invites comment.

Report finding → Email subject line: One sentence. Include a specific number or percentage. State the outcome clearly — not just the topic.

Blog post → Slide headline: Max 8 words. Should work as a standalone statement — someone should understand the point without reading the slide.

Source content: [PASTE YOUR CONTENT]
Target format: [SPECIFY — LinkedIn post / email subject / slide headline / Twitter thread / executive summary / other]`,'few','t')}

${pb('Customer Persona Builder — with Chain of Thought',`Role: Act as a market research analyst with experience developing buyer personas for B2B companies.

Context: We sell [PRODUCT/SERVICE] to [GENERAL AUDIENCE DESCRIPTION]. I have gathered the following data about our buyers: [PASTE DATA — survey responses, interview notes, CRM characteristics, support ticket themes, sales call observations].

Task: Develop our primary buyer persona. Think step by step — start with demographics, then goals, then pain points, then buying triggers, then objections, then preferred information channels. Reason through each dimension before summarising.

Format: Named persona + One-paragraph profile + Table: Goals | Pain Points | Buying Triggers | Objections | Information Sources.

Constraints: Only use what I've provided. Flag where assumptions were made. No invented data. Persona should feel like a real person, not a demographic category.`,'cot','a')}

${pb('Social Media Calendar Brief',`Role: Act as a social media strategist with B2B content experience.

Context: I need content for [PLATFORM — LinkedIn/Twitter/Instagram] for [TIMEFRAME — e.g. next 2 weeks / this month]. Our audience is [DESCRIPTION — job titles, interests, pain points]. Our primary goal is [AWARENESS/ENGAGEMENT/LEAD GENERATION].

Task: Create a content brief for [NUMBER] posts. Topics to cover: [LIST 3–5 THEMES].

Format: Table — Post # | Theme | Post Type (thought leadership/case study/tip/question/behind the scenes) | Hook (first line) | Key Message (1 sentence) | Call to Action.

Constraints: Each hook must create curiosity or challenge an assumption. No generic tips. At least [NUMBER] posts must reference a specific stat or real example.`,'rctfc','')}`,

'6-2': `
<div class="slabel">HR &amp; People — complete prompts, ready to run</div>
${pb('Job Description Writer',`Role: Act as a senior HR business partner with experience writing compelling, inclusive job descriptions.

Context: We are hiring a [JOB TITLE] in [DEPARTMENT/TEAM]. This role reports to [MANAGER ROLE]. Key responsibilities: [LIST 3–5]. Ideal profile: [DESCRIBE — experience level, must-have skills, working style]. Our culture in 3 words: [WORDS].

Task: Write a complete, compelling job description for this role.

Format: Role summary (2 sentences) + Why this role matters (2 sentences) + Key Responsibilities (6 bullets, outcome-focused) + Required Qualifications (5 bullets) + Nice to Have (3 bullets) + About Us (2 sentences).

Constraints: Inclusive language throughout — avoid gendered words, unnecessary degree requirements, and exclusionary phrases. Responsibilities must describe outcomes, not just activities. No jargon.`,'rctfc','')}

${pb('Performance Review Summary',`Role: Act as an HR specialist supporting formal performance review documentation.

Context: Below are my notes from a performance review conversation with [EMPLOYEE ROLE] for the period [DATES]. Key themes discussed: [BRIEFLY LIST — what went well, what needs development, any significant incidents, goals we discussed].

Task: Write a structured performance summary suitable for the employee's formal review record. This will be seen by HR and potentially the employee.

Format: Achievements (3 specific bullets with evidence) + Development Areas (2 bullets with concrete examples, not vague criticism) + Agreed Goals for Next Period (3 bullets with success metrics) + Overall Rating Rationale (1 paragraph).

Constraints: Specific and evidence-based throughout. No vague praise ("great team player") or vague criticism ("needs to improve"). Professional, fair, and objective tone. Under 350 words.

[PASTE YOUR NOTES BELOW]`,'rctfc','')}

${pb('Interview Question Generator — with Chain of Thought',`Role: Act as a talent acquisition specialist with experience in competency-based interviewing.

Context: We are interviewing for [JOB TITLE]. The three most critical competencies for success in this role are: [COMPETENCY 1], [COMPETENCY 2], [COMPETENCY 3].

Task: Generate structured interview questions for each competency. Think step by step — for each competency, first define what excellent performance looks like in this specific role, then design a behavioural question that would surface evidence of it, then design a follow-up probe that goes deeper.

Format: For each competency — Excellence Definition (1 sentence) + Primary Question + Follow-Up Probe.

Constraints: All primary questions must be behavioural ("Tell me about a time when..."). No hypothetical questions ("What would you do if..."). Follow-up probes must dig into specific actions taken, not just intentions.`,'cot','a')}

${pb('Policy Simplifier — Few-Shot',`Simplify the following HR policy text into plain language that any employee can understand. Here are two examples:

Original: "Annual leave entitlement must be formally requested and approved by the immediate line manager no fewer than five (5) working days prior to the commencement of the intended leave period."
Simplified: "Book leave at least 5 working days before your start date. Your manager must approve it first."

Original: "Expense claims submitted more than thirty (30) calendar days after the transaction date will not be reimbursed without written authorisation from the Finance Director."
Simplified: "Submit expenses within 30 days of purchase. Claims older than 30 days need Finance Director approval in writing."

Now simplify this policy text:
[PASTE POLICY TEXT]

Guidelines: Keep every rule intact — simplify the language, not the meaning. Maximum 2 sentences per clause. Use "you" not "the employee".`,'few','t')}`,

'6-3': `
<div class="slabel">Finance &amp; Data — complete prompts, ready to run</div>
${pb('Variance Analysis Narrative',`Role: Act as a financial analyst writing for non-financial senior stakeholders who need to understand the story behind the numbers.

Context: Below is budget vs actual performance data for [PERIOD]. The primary audience is [LEADERSHIP LEVEL — e.g. the Executive Committee / Board / Department Heads]. They are not comfortable with raw data and need context, not just numbers.

Task: Write a variance analysis narrative that explains what happened, why it happened, and what the implications are for the remainder of [PERIOD/YEAR].

Format: Executive Summary (2 sentences — the headline) + Top 3 Variances Explained (one paragraph each: what, cause, implication) + Outlook (1 paragraph with forward-looking assessment).

Constraints: No abbreviations without explanation. Quantify every variance in both absolute (£/$) and percentage terms. Flag where data is estimated or incomplete. Under 400 words. Plain language — no finance jargon.

[PASTE VARIANCE DATA BELOW]`,'rctfc','')}

${pb('Budget Reforecast — Extract Step (run first)',`Below is our budget vs actual performance data for [PERIOD]: [PASTE DATA]

Your only job: extract the factual signals.
— Which lines are significantly over or under budget (define "significant" as >5% or >[AMOUNT])?
— What is the variance for each in absolute terms and as a percentage of budget?
— Are there any lines that have changed direction compared to prior period?
— Are there any lines approaching or exceeding their full-year budget allocation already?

List findings as numbered facts. No interpretation. No narrative. Just the signals.`,'chain','p')}

${pb('Budget Reforecast — Analyse Step (paste Step 1 output first)',`Using the variance signals identified above, now analyse the root causes and categorise each.

For each major variance, assess: Is this a timing difference (the cost/revenue will arrive in a later period)? A volume or rate change (more/less activity than planned)? A forecasting error (the budget assumption was wrong)? Or a structural change (the business reality has fundamentally changed)?

Think step by step. Flag where you are making assumptions due to data limitations. Be direct — don't hedge.

This analysis will form the basis of the reforecast narrative and management commentary.`,'chain','p')}

${pb('Cash Flow Risk Summary',`Role: Act as a treasury analyst reviewing near-term liquidity exposure.

Context: Here is our cash flow forecast for [TIMEFRAME]: [PASTE DATA OR DESCRIBE KEY LINES]. Our current working capital facility limit is [AMOUNT]. Payment terms with key suppliers are [TERMS]. Our largest receivables are due from [CUSTOMER(S)] on [DATE(S)].

Task: Identify the top 3 liquidity risks in this period and recommend one mitigation action for each.

Format: Risk summary table — Risk | Severity (High/Med/Low) | Timing | Mitigation Action | Recommended Owner. Then a 2-sentence summary of overall liquidity position.

Constraints: Specific numbers only. No generic risks. Each mitigation must be actionable in the next 10 working days. Flag any assumptions about data quality.`,'rctfc','')}`,

'6-4': `
<div class="slabel">Customer Support — complete prompts, ready to run</div>
${pb('Professional Response Generator',`Role: Act as a senior customer experience specialist with expertise in tone, de-escalation, and resolution.

Context: A customer has contacted us regarding [ISSUE — describe specifically]. Their emotional state: [FRUSTRATED/CONFUSED/UPSET/ESCALATING]. The actual situation: [WHAT HAPPENED — your understanding of the cause]. Our policy on this: [STATE RELEVANT POLICY]. Resolution available: [WHAT WE CAN DO].

Task: Write a professional, empathetic response that addresses the customer's concern and moves toward resolution.

Format: Opening acknowledgment (1 sentence, human not corporate) + Situation explanation (2 sentences) + What we are doing / next step (2 sentences) + Closing with clear next action (1 sentence). Under 130 words.

Constraints: No defensive language. No phrases like "we apologise for any inconvenience caused" or "as per our policy". Sound like a real person who genuinely wants to help. Be specific about timing and next steps.`,'rctfc','')}

${pb('FAQ Generator — Few-Shot',`Convert the following customer queries into polished FAQ entries in the format shown. Two examples:

Query: "How do I cancel my subscription?"
FAQ Entry:
Q: How do I cancel my subscription?
A: You can cancel anytime from Settings → Account → Cancel Subscription. Your access continues until the end of the current billing period, and no cancellation fees apply.

Query: "I was charged but didn't get a receipt."
FAQ Entry:
Q: I was charged but haven't received a receipt — what should I do?
A: Receipts are sent automatically to your registered email within 10 minutes of a transaction. Check your spam folder first. If it's not there, contact us at [EMAIL] with the date and amount and we'll resend it.

Now convert these queries into FAQ entries using the same format: [PASTE YOUR LIST OF QUERIES]`,'few','t')}

${pb('Escalation Brief — with Chain of Thought',`Role: Act as a senior customer success manager preparing an internal escalation for leadership review.

Context: Customer [NAME or ID] has an open issue regarding [ISSUE — describe] that has been unresolved for [DURATION]. Previous resolution attempts: [LIST WHAT WAS TRIED AND WHEN]. Customer tier / commercial value: [ARR / TIER / RELATIONSHIP DURATION].

Task: Write a structured escalation brief. Think step by step — first summarise the issue objectively, then assess the most likely root cause, then quantify the commercial and relationship risk of continued non-resolution, then recommend the specific escalation action and owner.

Format: Issue Summary (2 sentences) + Root Cause Assessment (2–3 sentences) + Risk if Unresolved (1 sentence with commercial impact if known) + Recommended Action (1 sentence with owner and timeline).

Constraints: No blame language. Objective and factual throughout. Under 200 words.`,'cot','a')}

${pb('Post-Resolution Follow-Up Email',`Role: Act as a customer success specialist maintaining a positive customer relationship after a resolved support case.

Context: Customer [NAME] contacted us on [DATE] regarding [ISSUE — brief description]. The issue was resolved by [WHAT WAS DONE] on [RESOLUTION DATE]. This is the first contact since resolution.

Task: Write a warm follow-up email to check the issue is fully resolved and offer a next step.

Format: Subject line + 3 short paragraphs + sign-off. Under 120 words.

Constraints: Warm but professional — not overly effusive. Reference their specific original issue (not a generic "your recent query"). Offer one clear next step. Do not ask for a review or rating in this email — this is a care touchpoint, not a survey request.`,'rctfc','')}`,

'6-5': `
<div class="slabel">Tech &amp; Product — complete prompts, ready to run</div>
${pb('User Story Generator',`Role: Act as a senior product manager writing for an agile engineering team.

Context: We are building a feature for [PRODUCT NAME]: [FEATURE DESCRIPTION — what it does and why]. The primary user is [USER TYPE — job title or description]. The business goal this feature supports: [GOAL]. Engineering context: [ANY TECHNICAL CONSTRAINTS OR PLATFORM NOTES].

Task: Write 3 user stories with acceptance criteria for this feature.

Format: For each story:
— User story: "As a [user], I want [action] so that [benefit]."
— Acceptance Criteria: 3–5 bullets in Given/When/Then format.

Constraints: Stories must be independently testable and deployable. No technical implementation detail in the user story itself. Acceptance criteria must be unambiguous — a tester should be able to determine pass/fail with no further context.`,'rctfc','')}

${pb('Bug Report Analyser — with Chain of Thought',`Role: Act as a senior QA engineer and systems analyst.

Context: We received this bug report: [PASTE BUG REPORT]. The affected system/component: [SYSTEM]. User impact: [HOW MANY USERS AFFECTED, WHAT BEHAVIOUR THEY SEE]. Environment: [PRODUCTION/STAGING, VERSION NUMBER].

Task: Analyse this bug. Think step by step — first reproduce the failure scenario in your reasoning, then identify the most likely root cause, then list 2 alternative root causes, then assess severity and user impact, then recommend the priority level and the most valuable first debugging step.

Format: Root Cause (most likely) + 2 Alternatives + Severity Assessment (P1/P2/P3 with justification) + Recommended First Step.

Constraints: Specific to this bug and system — no generic "check the logs" advice. Reference the particular component, flow, or state described in the report. Under 250 words.`,'cot','a')}

${pb('Release Notes Writer',`Role: Act as a technical writer who translates engineering changes into clear customer-facing language.

Context: The engineering team has completed the following changes for version [VERSION NUMBER]: [PASTE CHANGELOG OR COMMIT NOTES]. The audience is our end users — they are [TECHNICAL LEVEL — non-technical / moderately technical / developer-level].

Task: Write customer-facing release notes for this version.

Format: Version header + What's New (3–5 bullets — user benefit focused) + Improvements (2–3 bullets) + Bug Fixes (2–3 bullets) + Deprecations (if any, 1–2 bullets).

Constraints: No engineering jargon in the customer-facing bullets. Each "What's New" bullet must state the user benefit first, not the technical implementation. The total should be scannable in 90 seconds. Under 250 words.`,'rctfc','')}

${pb('Technical Requirements — Extract Step (Prompt Chain)',`Below are the notes from our requirements discussion: [PASTE MEETING NOTES, USER RESEARCH, OR BRIEF]

Extract only the explicit requirements — do not interpret or add anything not directly stated.

Categorise as you extract:
— Functional requirements (what the system must do)
— Non-functional requirements (performance, security, scalability standards)
— Constraints (technology choices, integration requirements, compliance needs)
— Assumptions made during discussion (things treated as true but not confirmed)

Number each requirement. Flag anything ambiguous with [NEEDS CLARIFICATION]. This extraction will be reviewed before any further work proceeds.`,'chain','p')}`,

  };
  return M[k]||'<div class="card"><div class="cbody">Content loading...</div></div>';
}

/* ═══════════════════════════════════════════════
   RENDER
═══════════════════════════════════════════════ */
function render(){
  const s=SECTIONS[active];
  const t=activeTabs[active];

  // Sidebar
  document.getElementById('nav').innerHTML=SECTIONS.map((sec,i)=>`
    <button class="nb${i===active?' active':''}" onclick="navigate(${i})">
      <span class="nem">${sec.emoji}</span>
      <div class="ntxt"><div class="ntit">${sec.title}</div><div class="nsub">${sec.sub}</div></div>
    </button>`).join('');

  // Top bar
  document.getElementById('sec-title').textContent=s.title;
  document.getElementById('sec-sub').textContent=s.sub;

  // Tab dots
  document.getElementById('tab-dots').innerHTML=s.tabs.map((_,i)=>
    `<button class="tdot${i===t?' active':''}" onclick="switchTab(${i})" title="Tab ${i+1}"></button>`).join('');

  // Tab bar
  document.getElementById('tabbar').innerHTML=s.tabs.map((tab,i)=>
    `<button class="tbtn${i===t?' active':''}" onclick="switchTab(${i})">${tab}</button>`).join('');

  // Content
  document.getElementById('content').innerHTML=c(active,t);
  document.getElementById('content').scrollTop=0;
}

function navigate(i){ active=i; render(); }
function switchTab(i){ activeTabs[active]=i; render(); }

/* Init */
render();
</script>
